<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Arquitectura y Seguridad</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #2563eb;
      --accent: #38bdf8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    header {
      padding: 3rem 1.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 2.2rem; color: var(--accent); }
    header p { color: var(--text-muted); font-size: 1.1rem; margin-top: 0.5rem; }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .topic-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topic-card h2 { margin: 0; font-size: 1.2rem; color: var(--text); }
    .topic-card p { margin: 0.3rem 0 0; color: var(--text-muted); font-size: 0.95rem; }
    .btn {
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <header>
    <h1>🛡️ Portal de Documentación</h1>
    <p>Índice general de temas y guías de arquitectura</p>
  </header>
  <div class="container">
    <div class="topic-card">
      <div>
        <h2>Autenticación y Autorización JWT</h2>
        <p>Guía interactiva paso a paso (conceptos, middlewares backend y router frontend).</p>
      </div>
      <a href="manual/01_autenticacion_jwt.html" class="btn">Ver Guía →</a>
    </div>
  </div>
</body>
</html>
